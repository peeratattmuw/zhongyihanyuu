<html lang="th">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ฝึกคัดคำศัพท์จีน</title>
<style>
:root{--bg:#f3f1ec;--surf:#fffdf8;--ink:#1f2a2e;--mute:#6b777b;--line:#d9d4c8;--jade:#1f6b5c;--jadeink:#fff;--red:#b3392f;--grid:#e8c9c4;--box:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201e;--surf:#1c2b28;--ink:#eef2ee;--mute:#9bb0aa;--line:#33463f;--jade:#5fc2a8;--jadeink:#0d1b18;--red:#ff8f84;--grid:#5a3a38;--box:#f7f4ec}}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:"Sarabun","Noto Sans Thai","Noto Sans SC",system-ui,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:520px;margin:0 auto;padding:16px;min-height:100%;display:flex;flex-direction:column;gap:14px}
h1{font-size:22px;margin:8px 0 0}
p{margin:0;color:var(--mute)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:16px}
button{font:inherit;border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:10px;padding:12px 14px;cursor:pointer}
button:focus-visible{outline:3px solid var(--jade);outline-offset:2px}
button.main{background:var(--jade);color:var(--jadeink);border-color:var(--jade);font-weight:700}
button.bad{border-color:var(--red);color:var(--red);font-weight:700}
.menu{display:grid;gap:10px}
.row{display:flex;gap:10px}.row>*{flex:1}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--jade);width:0}
.top{display:flex;justify-content:space-between;font-size:14px;color:var(--mute)}
.pinyin{font-size:34px;font-weight:700;text-align:center;letter-spacing:.5px}
.mean{text-align:center;font-size:18px;margin-top:4px}
.pos{color:var(--mute);font-size:14px}
.pad{position:relative;width:100%;margin:0 auto;background:var(--box);border-radius:12px;border:1px solid var(--line);overflow:hidden;touch-action:none}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.inv{visibility:hidden}
.ans{font-size:48px;text-align:center;font-family:"Noto Serif SC","Songti SC",serif;color:var(--jade);line-height:1.2;word-break:keep-all}
.hidden{display:none}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.box{background:var(--surf);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:18px;width:100%;max-width:380px;display:grid;gap:12px}
.num{font:inherit;font-size:40px;font-weight:700;text-align:center;width:100%;padding:6px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);-webkit-user-select:text;user-select:text}
input[type=range]{accent-color:var(--jade)}
#b1,#b2{position:sticky;bottom:0;background:var(--bg);padding:8px 0;z-index:5}
.big{font-size:44px;font-weight:700;text-align:center}
.list{display:grid;gap:6px;font-size:18px}
.list div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:6px 0}
</style>
</head>

function pick(list,title){
  const tot=list.length;
  if(tot<=1){start(list);return}
  const ov=document.createElement('div');ov.className='ov';
  const d=Math.min(20,tot);
  ov.innerHTML=`<div class="box"><b>${title}</b><p>เลือกจำนวนคำที่จะฝึก (มี ${tot} คำ)</p>
  <input id="pn" class="num" type="number" inputmode="numeric" min="1" max="${tot}" value="${d}">
  <input id="ps" type="range" min="1" max="${tot}" value="${d}" style="width:100%">
  <div class="row" style="font-size:20px"><button data-d="-5">-5</button><button data-d="-1">-</button><button data-d="1">+</button><button data-d="5">+5</button></div>
  <div class="row">${[10,20,30].filter(x=>x<tot).map(x=>`<button data-q="${x}">${x}</button>`).join('')}<button data-q="${tot}">ทั้งหมด</button></div>
  <div class="row"><button id="pc">ยกเลิก</button><button class="main" id="pg">เริ่ม</button></div></div>`;
  document.body.appendChild(ov);
  const n=ov.querySelector('#pn'),s=ov.querySelector('#ps');
  const clamp=v=>Math.max(1,Math.min(tot,Math.floor(+v)||1));
  s.oninput=()=>{n.value=s.value};
  n.oninput=()=>{if(n.value!=='')s.value=clamp(n.value)};
  ov.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{n.value=s.value=b.dataset.q});
  ov.querySelectorAll('[data-d]').forEach(b=>{
    const st=()=>{n.value=s.value=clamp((+n.value||0)+(+b.dataset.d))};
    let t1=null,t2=null;
    const stop=()=>{clearTimeout(t1);clearInterval(t2);t1=t2=null};
    b.onpointerdown=e=>{e.preventDefault();st();stop();t1=setTimeout(()=>{t2=setInterval(st,70)},400)};
    b.onpointerup=b.onpointercancel=b.onpointerleave=stop;
    b.oncontextmenu=e=>e.preventDefault();
    b.onclick=e=>{if(e.detail===0)st()};
  });
  ov.querySelector('#pc').onclick=()=>ov.remove();
  ov.querySelector('#pg').onclick=()=>{const k=clamp(n.value);ov.remove();start(shuffle(list).slice(0,k))};
}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
function ld(){try{return JSON.parse(localStorage.getItem('dwrong')||'[]')}catch(e){return[]}}
function sv(a){try{localStorage.setItem('dwrong',JSON.stringify(a))}catch(e){}}
const app=document.getElementById('app');
document.addEventListener('gesturestart',e=>e.preventDefault());
let deck=[],i=0,wrong=[],ok=0,hint=true,listen=false,res=[],limit=0,timer=null,t0=0,tlimit=0,tmode='off',tleft=0,ttimer=null,tEnd=0,timedOut=false;

function updTT(){const e=document.getElementById('tt');if(e){e.textContent='รวม '+Math.floor(tleft/60)+':'+String(Math.max(tleft,0)%60).padStart(2,'0');e.style.color=tmode==='down'&&tleft<=30?'var(--red)':''}}
function menu(){
  clearInterval(ttimer);
  clearInterval(timer);
  app.innerHTML=`<h1>ฝึกคัดคำศัพท์จีน</h1>
  <p>ดูพินอินกับคำแปล แล้วเขียนตัวอักษรจีนลงในช่อง จากนั้นกดเฉลยเพื่อตรวจ</p>
  <div class="menu card">
   ${CH.slice().sort((a,b)=>a.n-b.n).map(c=>`<button data-s="${c.n}">บทที่ ${c.n} (${c.w.length} คำ)</button>`).join('')}
   <button class="main" data-s="all">รวมทุกบท (${ALL.length} คำ)</button>
   ${ld().length?`<button data-s="wrong">ทบทวนคำที่เคยผิด (${ld().length} คำ)</button>`:''}
   <label style="display:flex;gap:8px;align-items:center;color:var(--mute)"><input type="checkbox" id="hint" ${hint?'checked':''}> แสดงเส้นช่วยกริด</label>
   <label style="display:flex;gap:8px;align-items:center;color:var(--mute)"><input type="checkbox" id="lis" ${listen?'checked':''}> โหมดฟังเสียง (ซ่อนพินอินและคำแปล เล่นเสียงให้เขียนตาม)</label>
   <label style="display:flex;gap:8px;align-items:center;color:var(--mute)">จับเวลาต่อคำ <select id="lim" style="font:inherit;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--surf);color:var(--ink)">${[0,10,20,30,60].map(x=>`<option value="${x}" ${limit===x?'selected':''}>${x?x+' วินาที':'ไม่จับเวลา'}</option>`).join('')}</select></label>
   <label style="display:flex;gap:8px;align-items:center;color:var(--mute)">จับเวลารวมทั้งรอบ <select id="tmode" style="font:inherit;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--surf);color:var(--ink)">${[['off','ไม่จับเวลา'],['up','นับเดินหน้า'],['down','นับถอยหลัง']].map(m=>`<option value="${m[0]}" ${tmode===m[0]?'selected':''}>${m[1]}</option>`).join('')}</select><select id="tl" style="display:${tmode==='down'?'inline-block':'none'};font:inherit;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--surf);color:var(--ink)">${[5,10,15,30,60].map(x=>`<option value="${x}" ${tlimit===x?'selected':''}>${x} นาที</option>`).join('')}</select></label>
  </div>`;
  const tmS=document.getElementById('tmode'),tlS=document.getElementById('tl');
  tmS.onchange=()=>{tlS.style.display=tmS.value==='down'?'inline-block':'none'};
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{hint=document.getElementById('hint').checked;listen=document.getElementById('lis').checked;limit=+document.getElementById('lim').value;tmode=document.getElementById('tmode').value;tlimit=+document.getElementById('tl').value;const k=b.dataset.s;const L=k==='all'?ALL:k==='wrong'?ALL.filter(w=>ld().includes(w[0])):CH.find(c=>String(c.n)===k).w;
    if(k==='wrong')start(L);else pick(L,k==='all'?'รวมทุกบท':'บทที่ '+k)});
}
function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function start(list){deck=shuffle(list);i=0;wrong=[];ok=0;res=[];t0=Date.now();timedOut=false;clearInterval(ttimer);tleft=tmode==='down'?tlimit*60:0;
  if(tmode!=='off')ttimer=setInterval(()=>{tleft+=tmode==='down'?-1:1;updTT();if(tmode==='down'&&tleft<=0){clearInterval(ttimer);timedOut=true;done()}},1000);
  show()}

function show(){
  clearInterval(timer);
  if(i>=deck.length)return done();
  const [zh,py,pos,en]=deck[i];
  app.innerHTML=`<div class="top"><div class="row" style="flex:none"><button id="q" style="padding:6px 10px">ออก</button><button id="back" style="padding:6px 10px" ${i===0?'disabled':''}>← ย้อนกลับ</button></div><span>${tmode!=='off'?'<b id="tt"></b>  ':''}${limit?'<b id="tm"></b>  ':''}${i+1} / ${deck.length}</span></div>
  <div class="bar"><i style="width:${i/deck.length*100}%"></i></div>
  <div class="card"><div class="pinyin${listen?' inv':''}">${py}</div><div class="mean${listen?' inv':''}">${TH[zh]?TH[zh]+'<br><span class="pos">'+en+'</span>':en}</div><div class="pos${listen?' inv':''}" style="text-align:center">${pos}</div><div id="ans" class="ans inv">${zh}</div></div>
  <div class="pad" id="pad"><canvas id="c"></canvas></div>
  
  <div class="row" id="b1"><button id="spk">ฟัง</button><button id="clr">ลบ</button><button class="main" id="rev">เฉลย</button></div>
  <div class="row hidden" id="b2"><button id="again">อีกครั้ง</button><button class="bad" id="no">ผิด</button><button class="main" id="yes">เขียนถูก</button></div>`;
  document.getElementById('q').onclick=menu;
  document.getElementById('back').onclick=()=>{i--;show()};
  setupCanvas(zh.length);updTT();
  const reveal=()=>{
    clearInterval(timer);
    document.querySelectorAll('.pinyin,.mean,.pos').forEach(x=>x.classList.remove('inv'));document.getElementById('ans').classList.remove('inv');document.getElementById('b2').classList.remove('hidden');
    document.getElementById('b1').classList.add('hidden');
  };
  document.getElementById('rev').onclick=reveal;
  document.getElementById('spk').onclick=()=>speak(zh);
  if(listen)speak(zh);
  if(limit){let left=limit;const tm=document.getElementById('tm');tm.textContent=left+' วิ';
    timer=setInterval(()=>{left--;tm.textContent=left+' วิ';if(left<=5)tm.style.color='var(--red)';if(left<=0)reveal()},1000)}
  document.getElementById('again').onclick=()=>show();
  document.getElementById('yes').onclick=()=>{res[i]='y';sv(ld().filter(z=>z!==deck[i][0]));i++;show()};
  document.getElementById('no').onclick=()=>{res[i]='n';sv([...new Set([...ld(),deck[i][0]])]);i++;show()};
}
function setupCanvas(n){
  const pad=document.getElementById('pad'),c=document.getElementById('c');
  const cols=Math.min(n,4),rows0=Math.ceil(n/cols);
  pad.style.aspectRatio=cols+'/'+rows0;
  pad.style.width='min(100%, '+(40*cols/rows0)+'vh)';
  const r=pad.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  c.width=r.width*dpr;c.height=r.height*dpr;
  const g=c.getContext('2d',{desynchronized:true});g.scale(dpr,dpr);
  const w=r.width,h=r.height;
  function grid(){
    g.clearRect(0,0,w,h);
    if(!hint)return;
    g.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--grid');
    g.lineWidth=1;g.setLineDash([4,4]);
    const rows=rows0,ch=w/cols;
    for(let k=0;k<n;k++){
      const x=(k%cols)*ch,y=Math.floor(k/cols)*ch;
      g.strokeRect(x+1,y+1,ch-2,ch-2);
      g.beginPath();g.moveTo(x+ch/2,y);g.lineTo(x+ch/2,y+ch);g.moveTo(x,y+ch/2);g.lineTo(x+ch,y+ch/2);g.stroke();
    }
    g.setLineDash([]);
  }
  let strokes=[],cur=null;
  function draw(){
    grid();g.strokeStyle='#1b1b1b';g.lineWidth=4;g.lineCap='round';g.lineJoin='round';
    strokes.forEach(s=>{g.beginPath();s.forEach((p,k)=>k?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));if(s.length===1)g.lineTo(s[0][0]+.1,s[0][1]);g.stroke()});
  }
  const pt=e=>{const b=c.getBoundingClientRect();return[(e.clientX-b.left)*w/b.width,(e.clientY-b.top)*h/b.height]};
  ['touchstart','touchmove','touchend'].forEach(t=>c.addEventListener(t,e=>e.preventDefault(),{passive:false}));
  c.onpointerdown=e=>{e.preventDefault();c.setPointerCapture(e.pointerId);const p=pt(e);cur=[p];strokes.push(cur);g.strokeStyle='#1b1b1b';g.lineWidth=4;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(p[0],p[1]);g.lineTo(p[0]+.1,p[1]);g.stroke()};
  c.onpointermove=e=>{if(!cur)return;e.preventDefault();const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];g.strokeStyle='#1b1b1b';g.lineWidth=4;g.lineCap='round';g.lineJoin='round';for(const ev of (evs.length?evs:[e])){const a=cur[cur.length-1],p=pt(ev);cur.push(p);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(p[0],p[1]);g.stroke()}};
  c.onpointerup=c.onpointercancel=()=>{cur=null};
  document.getElementById('clr').onclick=()=>{strokes=[];draw()};
  draw();
}
function done(){
  ok=res.filter(r=>r==='y').length;clearInterval(ttimer);clearInterval(timer);tEnd=Date.now();wrong=deck.filter((_,k)=>res[k]!=='y');
  const miss=wrong.length;
  app.innerHTML=`<h1>${timedOut?'หมดเวลา':'จบรอบนี้'}</h1>
  <div class="card"><div class="big">${ok} / ${deck.length}</div><p style="text-align:center">เขียนถูก ${ok} คำ ใช้เวลา ${Math.floor((tEnd-t0)/60000)} นาที ${Math.floor((tEnd-t0)/1000)%60} วินาที</p></div>
  ${miss?`<div class="card"><b>คำที่ต้องทบทวน</b><div class="list">${wrong.map(w=>`<div><span>${w[0]}</span><span style="color:var(--mute);font-size:15px">${w[1]}</span></div>`).join('')}</div></div>
  <button class="main" id="re">ฝึกเฉพาะคำที่ผิด (${miss})</button>`:'<p style="text-align:center">ถูกหมดทุกคำ</p>'}
  <div class="row"><button id="bk">← ย้อนกลับ</button><button id="m">กลับเมนู</button></div>`;
  document.getElementById('bk').onclick=()=>{i=deck.length-1;show()};
  if(miss)document.getElementById('re').onclick=()=>start(wrong);
  document.getElementById('m').onclick=menu;
}
menu();
</script>
</body>
</html>
